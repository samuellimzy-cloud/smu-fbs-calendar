<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FBS navigation links fixture</title></head>
<body>
  <nav>
    <a id="booking_anchor" href="#booking">Booking</a>
    <a id="mybookings_anchor" href="javascript:v()"><div id="MyBookingsTab"><img id="mybookings1" alt="" width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><span>My Bookings</span><img id="mybookings2" alt="" hidden width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></div></a>
    <a id="mybookings_anchor_decoy" href="#decoy">My Bookings</a>
  </nav>
  <button id="view-booking">VIEW</button>
  <button id="edit-booking">EDIT</button>
  <button id="cancel-booking">CANCEL</button>
  <section id="booking-pane"><h2>Booking availability</h2><p>Select My Bookings to see existing reservations.</p></section>
  <script>
    const mode = new URLSearchParams(location.search).get('mode');
    const anchor = document.getElementById('mybookings_anchor');
    window.v = () => {};
    window.__childBound = false;
    anchor.addEventListener('click', () => { if (!window.__childBound) top.__earlyAnchorClicks += 1; }, true);
    for (const item of document.querySelectorAll('button, #booking_anchor, #mybookings_anchor_decoy')) {
      item.addEventListener('click', event => { event.preventDefault(); top.__unsafeClicks += 1; });
    }
    function mountBookings() {
      if (document.getElementById('bookings-frame')) return;
      const frame = document.createElement('iframe');
      frame.id = 'bookings-frame';
      frame.title = 'Fictional existing bookings';
      frame.src = mode === 'empty' ? 'navigation-empty.html' : 'live-bookings.html';
      frame.style.cssText = 'width:100%;height:540px;border:0';
      document.getElementById('booking-pane').replaceChildren(frame);
    }
    if (mode === 'missing') anchor.remove();
    else {
      if (mode === 'unsafe') anchor.href = 'https://example.invalid/';
      function bindChildNavigation() {
        window.__childBound = true;
        document.getElementById('MyBookingsTab').addEventListener('click', event => {
          event.preventDefault();
          top.__navigationClicks += 1;
          if (mode !== 'stuck') setTimeout(mountBookings, 180);
        });
      }
      if (mode === 'late-binding') {
        window.addEventListener('load', () => {
          document.getElementById('booking-pane').textContent = 'Default Booking initialized at load';
          bindChildNavigation();
        }, {once: true});
        const delayed = document.createElement('script');
        delayed.src = 'navigation-load-delay.js';
        delayed.async = true;
        document.head.appendChild(delayed);
      } else bindChildNavigation();
    }
    if (mode === 'password') {
      const password = document.createElement('input');
      password.type = 'password';
      password.setAttribute('aria-label', 'Fictional manual sign-in');
      document.body.appendChild(password);
    }
    if (mode === 'already') mountBookings();
  </script>
</body>
</html>
